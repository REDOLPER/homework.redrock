  <defs>
    <mask id="door-cutout">
      <!-- 白色表示保留，黑色表示挖掉 -->
      <rect x="0" y="0" width="24" height="24" fill="white"/>
      <!-- 黑色矩形挖掉门洞 -->
      <rect x="11.5" y="11.8" width="1" height="4.6" fill="black" rx="0.5"/>
    </mask>
  </defs>
  
  <!-- 应用遮罩的五边形 -->
  <path d="M12 4.5Q12.6 4.5 13 4.9L18.5 9.5Q19 9.9 18.8 10.5L17.3 17.3Q17.1 17.6 16.6 17.6H7.4Q6.9 17.6 6.7 17.3L5.2 10.5Q5 9.9 5.5 9.5L11 4.9Q11.4 4.5 12 4.5Z" mask="url(#door-cutout)"/>
